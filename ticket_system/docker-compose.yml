version: '3.8'

services:
  ticket-system:
    build: .
    container_name: ticket-system
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
      - ./tickets.db:/app/tickets.db
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=change-this-secret-key-in-production
    restart: unless-stopped
    networks:
      - ticket-network

networks:
  ticket-network:
    driver: bridge
